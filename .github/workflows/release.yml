# Continuous deployment: every push to main rebuilds the Release plugin package
# and publishes it to a versioned GitHub release.

name: release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build BadPigPlugin.sln -c Release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content BadPigPlugin/BadPigPlugin.csproj)
          $modVersion = $csproj.Project.PropertyGroup.Version
          if (-not $modVersion) {
            Write-Error "Could not read version from csproj"
            exit 1
          }
          "tag=v$modVersion" >> $env:GITHUB_OUTPUT

          New-Item -ItemType Directory dist -Force | Out-Null
          Compress-Archive -Path Build/Release/BepInEx -DestinationPath dist/BadPigPlugin.zip -Force
          $hash = (Get-FileHash dist/BadPigPlugin.zip -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          SHA: ${{ github.sha }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          ASSET="dist/BadPigPlugin.zip"
          NOTES=$(printf 'Built from commit %s\nSHA256: %s' "${SHA:0:7}" "$SHA256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$ASSET" --title "BadPigPlugin $TAG" --target "$SHA" --notes "$NOTES"
          fi
